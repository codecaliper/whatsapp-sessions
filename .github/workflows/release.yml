name: Release

# Every push to main becomes a GitHub release. The version comes from the Conventional Commits
# since the last tag: "feat" → minor, "fix" and everything else → patch, "!" or
# "BREAKING CHANGE:" → major. The bot commits the bump to manifest.json and package.json, tags
# it, and attaches the extension zip.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.0 (without v). Leave blank to work it out from the commits."
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # The bot's own release commit doesn't need another release.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Latest main, not the triggering commit, so queued runs build on the previous release.
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Static checks and unit tests
        run: |
          npm run check
          npm test

      - name: Determine release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          current="$(node -p "require('./manifest.json').version")"
          last_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"

          if [[ -n "${last_tag}" ]]; then
            if [[ -z "$(git rev-list "${last_tag}..HEAD")" ]]; then
              echo "Nothing new since ${last_tag}."
              echo "skip=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            python3 .github/scripts/validate-conventional-commits.py --base "${last_tag}" --head HEAD
            range="${last_tag}..HEAD"
          else
            # First release: ship the version already in manifest.json.
            range="HEAD"
          fi

          if [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION#v}"
          elif [[ -z "${last_tag}" ]]; then
            version="${current}"
          else
            messages="$(git log --no-merges --format=%B "${range}")"
            if grep -Eq '(^BREAKING[ -]CHANGE:|^[[:alpha:]]+(\([^)]+\))?!:)' <<<"${messages}"; then
              bump="major"
            elif grep -Eq '^feat(\([^)]+\))?: ' <<<"${messages}"; then
              bump="minor"
            else
              bump="patch"
            fi
            # shellcheck disable=SC2016 # JavaScript template literals, not shell expansions.
            version="$(node -e '
              const [major, minor, patch] = process.argv[1].split(".").map(Number);
              const bump = process.argv[2];
              console.log(bump === "major" ? `${major + 1}.0.0` : bump === "minor" ? `${major}.${minor + 1}.0` : `${major}.${minor}.${patch + 1}`);
            ' "${last_tag#v}" "${bump}")"
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: ${version}" >&2
            exit 1
          fi
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null || git ls-remote --exit-code --tags origin "${tag}" >/dev/null 2>&1; then
            echo "Release tag already exists: ${tag}" >&2
            exit 1
          fi

          echo "Releasing ${tag} (previous: ${last_tag:-none})"
          {
            echo "skip=false"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "range=${range}"
          } >> "${GITHUB_OUTPUT}"

      - name: Commit and tag release
        if: steps.version.outputs.skip == 'false'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run release:version -- "${{ steps.version.outputs.version }}"
          npm run check
          if ! git diff --quiet; then
            git add manifest.json package.json
            git commit -m "chore(release): ${{ steps.version.outputs.tag }}"
            git push origin HEAD:main
          fi
          git tag -a "${{ steps.version.outputs.tag }}" -m "Sessions for WhatsApp ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Package
        if: steps.version.outputs.skip == 'false'
        run: npm run package

      - name: Create GitHub release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node tools/release-notes.mjs "${{ steps.version.outputs.tag }}" "${{ steps.version.outputs.range }}" > "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md"
          gh release create "${{ steps.version.outputs.tag }}" dist/*.zip \
            --verify-tag \
            --latest \
            --title "Sessions for WhatsApp ${{ steps.version.outputs.tag }}" \
            --notes-file "${RUNNER_TEMP}/notes.md"
